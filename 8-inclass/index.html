<!DOCTYPE html>
<html lang="en">
<head>
<title>Times Table</title>
<meta charset="utf=8">
<style>
	body {
		background-color: #300040;
		
	}
	#wrapper {
		margin: auto;
		background-color: #ffffff;
		padding: 1em;
		border-radius: 5%;
		width: 80%;
	}
	table {
	margin: auto;
		border: 1px solid #000000;
		background-color: #999999; 
		text-align: center;
	}
	td, tr {
		font-weight: bold;
		border: 1px outset #000000;
		padding: .5em;
	}
	
	.movieCap {
		background-color: blue;
		color: white;
		padding: 1em;
		font-family: Arial, sans-serif;
		font-weight: bold;
	}
	
	.styleRed {
		color: #d90000;
	}
	
	.styleGrey {
		background-color: #888888;
	}
	
</style>
<link rel="icon" type="image/x-icon" href="img3.ico">
</head>

<body>
<div id="wrapper">
<table>
<caption class="movieCap">Schedule</caption>
	<thead>
		<tr>
			<th></th>
			<th>Monday</th>
			<th>Tuesday</th>
			<th>Wednesday</th>
			<th>Thursday</th>
			<th>Friday</th>
			<th>Saturday</th>
			<th>Sunday</th>
		</tr>
	</thead>

<tbody>
	<tr>
		<td rowspan="2">8:00am</td>
		<td rowspan="2" colspan="7">Breakfast</td>
	</tr>
	<tr></tr>
	<tr>
		<td rowspan="2">9:00am</td>
		<td rowspan="2">Discovery Lecture</td>
		<td rowspan="5">Cluster Course</td>
		<td rowspan="2">Discovery Lecture</td>
		<td rowspan="5">Cluster Course</td>
		<td rowspan="2">Discovery Lecture</td>
		<td rowspan="8"><img alt="Find Pic"></td>
		<td rowspan="8"><img alt="Find Pic"></td>
	</tr>
	<tr></tr>
	<tr>
		<td rowspan="2">10:00am</td>
		<td rowspan="3">Cluster Course</td>
		<td rowspan="3">Cluster Course</td>
		<td rowspan="3">Cluster Course</td>
	</tr>
	<tr></tr>
	<tr>
		<td rowspan="2">11:00am</td>
	</tr>
	<tr></tr>
	<tr>
		<td rowspan="2">12:00am</td>
		<td rowspan="2" colspan="5">Lunch</td>
	</tr>
	<tr></tr>
	
</tbody>

<tfoot>
<tr class="styleGrey">
	
</tr>
</tfoot>
</table>
</div>
</body>
</html>
