<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Flex1</title>
    <link rel="stylesheet" href="mystyle.css" />
</head>
<body>
    <div id="wrapper">
        <h1>Flexbox Gallery</h1>
        <div id="gallery">
            <figure id="bird1">
                <img src="bird1.jpg" width="200"
                     height="150" alt="Red Crested
                        Cardinal" />
                <figcaption>Bird1 - flex: 3;</figcaption>
            </figure>

            <figure id="bird2">
                <img src="bird2.jpg" width="200"
                     height="150" alt="Rose-Breasted
                        Grosbeak" />
                <figcaption>Bird2 - flex: none;</figcaption>
            </figure>

            <figure id="bird3">
                <img src="bird3.jpg" width="200"
                     height="150" alt="Gyrfalcon" />
                <figcaption>Bird3 - flex: auto;</figcaption>
            </figure>

            <figure id="bird4">
                <img src="bird4.jpg" width="200"
                     height="150" alt="Rock Wren" />
                <figcaption>Bird4 - flex: initial;</figcaption>
            </figure>

            <figure id="bird5">
                <img src="bird5.jpg" width="200"
                     height="150" alt="Coopers Hawk" />
                <figcaption>Bird5 - flex: 1;</figcaption>
            </figure>

            <figure id="bird6">
                <img src="bird6.jpg" width="200"
                     height="150" alt="Immature Bald Eagle" />
                <figcaption>Bird6 - flex: 6;</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
